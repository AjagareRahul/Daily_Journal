{% extends 'base.html' %}
{% block content %}
<div style="padding: 20px; font-family: Arial, sans-serif;">
<h2 style="color: #333;">This is home page</h2>

<h4 style="color: #555;">Accending Order</h4>
<form method="GET" style="margin: 15px 0;">
    <input type="" name="q" placeholder="search" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    <button type="submit" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Search</button>
</form> 

{% for student in students %}
<div style="background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 4px;">
    {{ student.name}} {{ student.age }} {{ student.city }}
</div>
{% endfor %}

<br>

<a href="/about/" style="margin-right: 15px;">Go to about</a>
<a href="/contact/">Go to contact</a>
</div>
{% endblock %}
