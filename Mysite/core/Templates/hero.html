{% load static %}
{% extends 'base.html' %}
{% block content %}
<div style="
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
    color: #e0e0e0;
">
    <img src="https://via.placeholder.com/150" alt="Profile" style="
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 25px;
        border: 3px solid #ffc107;
    ">
    
    <p style="font-size: 18px; margin: 0 0 10px 0;">Hello, I'm</p>
    
    <h1 id="typed-name" style="
        font-size: 36px;
        font-weight: 600;
        margin: 0 0 8px 0;
        color: #fff;
    ">Ajagare Rahul<span style="color: #ffc107;">|</span></h1>
    
    <p style="font-size: 18px; margin: 0 0 20px 0; color: #bbb;">Python/Django Developer</p>
    
    <p style="
        font-size: 16px;
        max-width: 500px;
        line-height: 1.6;
        margin: 0 0 30px 0;
        color: #ccc;
    ">
        Building clean, efficient web applications with Python and Django. Focused on creating intuitive user experiences and robust backend systems.
    </p>
    
    <a href="#projects" style="
        display: inline-block;
        padding: 12px 30px;
        background-color: #ffc107;
        color: #1a1a1a;
        text-decoration: none;
        border-radius: 25px;
        font-weight: 600;
        transition: background-color 0.3s;
    ">View Projects</a>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const nameElement = document.getElementById('typed-name');
    const cursor = nameElement.querySelector('span');
    const text = 'Ajagare Rahul';
    let index = 0;
    
    function type() {
        if (index <= text.length) {
            nameElement.textContent = text.substring(0, index);
            nameElement.appendChild(cursor);
            index++;
            setTimeout(type, 100);
        }
    }
    
    type();
});
</script>
{% endblock %}
