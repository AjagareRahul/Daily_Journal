
{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px; font-family: Arial, sans-serif;">

<h2 style="color: #333; margin-bottom: 20px;">This is about page</h2>
  
<form method="GET" style="margin: 15px 0;">
   <input type="text" name="q" placeholder="Search name" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
   <button type="submit" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Search</button>
</form>

<h4 style="color: #555;">Decending order</h4>
<hr style="margin: 20px 0;">

<form method="GET" style="margin: 15px 0;">
   <select name="sort" style="padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
     <option value="">Select </option>
     <option value="asc">Age Asc</option>
     <option value="desc">Age Desc</option>
   </select>
   <button type="submit" style="padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Sort</button>
</form>
  
{% for student in students %}
<div style="background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 4px;">
   Name:{{ student.name }} Age:{{ student.age }} City:{{ student.city }}
</div>
{% empty %}
<div style="background: #f9f9f9; padding: 10px; margin: 5px 0; border-radius: 4px;">
   No students found
</div>
{% endfor %}

<a href="/home" style="display: inline-block; margin: 10px 10px 10px 0;">Go to home</a>
<a href="/contact" style="display: inline-block;">Contact</a>

</div>
{% endblock %}
